# Unsigned installation testing only; see apps/desktop/packaging/README.md#local-macos-dmg-without-release-signing.
# GitHub retired macos-13. Build on Intel macOS 15 with a Ventura deployment target;
# installation on a real macOS 13 Intel machine is still required for qualification.
name: Package Desktop · macOS 13 · Intel · Unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: x64
      DSH_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check Intel build host
        run: |
          test "$(uname -m)" = x86_64
          sw_vers
          xcodebuild -version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check unsigned packaging toolchain
        run: pnpm run package:desktop:mac:x64:unsigned --check
      - name: Rebuild the speech binding for macOS 13
        run: |
          mkdir -p "$RUNNER_TEMP/ventura-sherpa"
          bash apps/desktop/scripts/build-ventura-sherpa-addon.sh "$RUNNER_TEMP/ventura-sherpa"
      - name: Build unsigned Intel DMG
        id: build
        env:
          DSH_DESKTOP_VENTURA_SHERPA_DIR: ${{ runner.temp }}/ventura-sherpa
        run: pnpm run package:desktop:mac:x64:unsigned
      # Check prebuilt dependencies too: the deployment environment only affects local compilation.
      - name: Check packaged Mach-O architecture and minimum macOS
        run: |
          python3 - <<'PY'
          import runpy
          import subprocess
          import tempfile
          from pathlib import Path

          checks = runpy.run_path('scripts/check-macos-deployment-target.py')
          app = Path('apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/mac/DeepSeek Harness.app')
          if not app.is_dir():
              raise RuntimeError(f'Missing packaged application: {app}')
          magic = {b'\xcf\xfa\xed\xfe', b'\xce\xfa\xed\xfe', b'\xfe\xed\xfa\xcf',
                   b'\xfe\xed\xfa\xce', b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca',
                   b'\xca\xfe\xba\xbf', b'\xbf\xba\xfe\xca'}
          count = 0
          for path in app.rglob('*'):
              if path.is_symlink() or not path.is_file():
                  continue
              with path.open('rb') as stream:
                  if stream.read(4) not in magic:
                      continue
              arches = subprocess.check_output(['lipo', '-archs', str(path)], text=True).split()
              if 'x86_64' not in arches:
                  raise RuntimeError(f'{path}: missing Intel slice ({arches})')
              # otool treats a trailing parenthesized helper name as an archive member.
              with tempfile.TemporaryDirectory(prefix='dsh-macho-') as temporary:
                  alias = Path(temporary) / 'executable'
                  alias.symlink_to(path.resolve())
                  try:
                      version = checks['deployment_target'](alias)
                  except subprocess.CalledProcessError as error:
                      raise RuntimeError(f'{path}: otool failed: {error.stderr}') from error
              checks['ensure_compatible'](path, version, 'macosx_13_0_x86_64')
              count += 1
          if count == 0:
              raise RuntimeError('No packaged Mach-O files checked')
          print(f'Checked {count} Mach-O files for Intel and macOS 13 compatibility')
          PY
      - name: Retain unsigned DMG
        # Preserve the installer for diagnosis even when compatibility validation fails.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos13-intel-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain packaging diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos13-intel-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
